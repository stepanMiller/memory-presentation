name: Publish to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/build.mjs'
      - 'scripts/check.mjs'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build presentation
        run: npm run build
      - name: Check build and controls
        run: npm run check
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload web build only
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish presentation
        id: deployment
        uses: actions/deploy-pages@v5
