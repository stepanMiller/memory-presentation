name: Build control scene
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: memory-control-scene
          path: dist/
# Deployment is intentionally absent. Yandex Cloud publication needs approval.
