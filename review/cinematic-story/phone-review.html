<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>MEMORY · проверка вертикальной композиции</title><style>body{margin:0;background:#e7e2da;color:#40382f;font:14px/1.5 system-ui;padding:22px}header{max-width:820px;margin:0 auto 20px}h1{font:28px Georgia,serif;margin:0 0 12px}select,a{font:inherit;color:inherit;min-height:44px}select{padding:8px;border:1px solid #b8aea0;background:#f4eee5}main{display:flex;justify-content:center}iframe{display:block;width:390px;height:844px;border:0;box-shadow:0 10px 45px #34261e30;background:#2d211b;max-width:100%}p{margin:8px 0}nav{display:flex;gap:20px;align-items:center;flex-wrap:wrap}</style><header><h1>Вертикальный просмотр</h1><p>Реальная HTML-сцена в окне 390 × 844. Проверка композиции, не эмуляция Safari.</p><nav><label>Эпизод <select id="episode"><option value="1">1. Человек</option><option value="2">2. Восприятие</option><option value="3">3. Вспомнить</option><option value="4">4. Сосудистая сеть</option><option value="5">5. Кислород</option><option value="6">6. Мелкий сосуд</option><option value="7">7. Миелин</option><option value="8">8. Разные причины</option><option value="9">9. Врач</option></select></label><label>Размер <select id="size"><option value="390,844">390 × 844</option><option value="320,640">320 × 640</option><option value="430,932">430 × 932</option></select></label><a href="index.html">Открыть историю</a></nav></header><main><iframe id="phone" src="index.html?v=4" title="Память. Мобильная композиция"></iframe></main><script>const phone=document.getElementById('phone');document.getElementById('episode').onchange=e=>phone.contentWindow.document.getElementById('episode-'+e.target.value).scrollIntoView({behavior:'instant',block:'start'});document.getElementById('size').onchange=e=>{const[w,h]=e.target.value.split(',');phone.style.width=w+'px';phone.style.height=h+'px';};</script></html>
