<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Контроль адаптивности сцены</title><style>body{font:14px Arial;background:#ddd;margin:15px}select,button{padding:12px}iframe{display:block;margin:10px auto;border:0;width:390px;height:1200px}pre{white-space:pre-wrap}</style><label>Ширина <select id="width"><option>320</option><option>375</option><option selected>390</option><option>430</option><option>768</option><option>1024</option><option>1440</option></select></label><button id="resize">Применить</button><button id="run">Проверить состояния</button><pre id="report">Ожидание проверки</pre><iframe id="preview" title="Контрольный экран" src="index.html"></iframe><script>
const f=document.querySelector('iframe'),report=document.querySelector('#report');document.querySelector('#resize').onclick=()=>f.style.width=document.querySelector('#width').value+'px';
document.querySelector('#run').onclick=async()=>{const results=[];const delay=ms=>new Promise(r=>setTimeout(r,ms));const d=f.contentDocument,w=f.contentWindow;for(const width of [320,375,390,430,768,1024,1440]){f.style.width=width+'px';await delay(80);for(const part of ['capillary','neuron','myelin']){const b=d.querySelector(`[data-part=${part}]`);b.click();const br=b.getBoundingClientRect(),sr=d.querySelector('#stage').getBoundingClientRect();results.push({width,part,selected:b.getAttribute('aria-pressed')==='true',fits:br.left>=0&&br.right<=width&&br.top>=sr.top&&br.bottom<=sr.bottom,overflow:d.documentElement.scrollWidth>width});}}d.querySelector('#reset').click();d.querySelector('#play').click();await delay(1000);const moves=!!d.querySelector('#oxygen g').getAttribute('transform');await delay(5700);const finite=d.querySelector('#stage').classList.contains('has-played');d.querySelector('#reset').click();const reset=!d.querySelector('#stage').classList.contains('has-played');f.style.width='390px';report.textContent=JSON.stringify({results,moves,finite,reset,pass:results.every(x=>x.selected&&x.fits&&!x.overflow)&&moves&&finite&&reset},null,2);};
</script></html>
